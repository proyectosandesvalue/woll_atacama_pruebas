# Nginx de desarrollo local (HTTP, sin TLS).
#
# Se publica en 127.0.0.1:8080 con docker-compose.dev.yml y proxya /api/* al
# servicio `api:3000`. No usa certificados.

limit_req_zone $binary_remote_addr zone=chat:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=proxy:10m rate=1200r/m;
limit_req_status 429;

proxy_cache_path /var/cache/nginx/proxy
    levels=1:2
    keys_zone=proxy_cache:20m
    max_size=1g
    inactive=12h
    use_temp_path=off;

# En desarrollo local se resuelve `api` al arrancar. Si se recrea solo el
# contenedor api, reiniciar nginx. En producción se usa `resolve` + DNS de
# Docker.
upstream woll_api {
    server api:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /srv/woll;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/vnd.mapbox-vector-tile
        image/svg+xml;

    # En desarrollo, JS/CSS sin caché para ver los cambios sin hard reload.
    # Producción mantiene `expires 7d` desde woll-locations.conf.
    location ^~ /js/ {
        expires -1;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /css/ {
        expires -1;
        access_log off;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/woll-locations.conf;
}
