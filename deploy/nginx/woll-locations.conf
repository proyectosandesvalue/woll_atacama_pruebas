# Locations compartidas por el server TLS (producción) y el server HTTP (dev).
# El `root`, `index`, gzip y headers de seguridad viven en cada server.

# ── ACME / healthcheck de Nginx ─────────────────────────────────────
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    access_log off;
}

location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# ── API Node ────────────────────────────────────────────────────────
# Upload de GeoJSON para el gestor de capas (Sprint 47).
location = /api/admin/layers/upload {
    # GeoJSON 100 MB / Shapefile ZIP 200 MB (el handler valida el límite real).
    client_max_body_size 210m;
    proxy_request_buffering off;
    proxy_pass http://woll_api;
    include /etc/nginx/snippets/woll-proxy.conf;
}

# Upload de PDFs al RAG: límite alto solo en esta ruta y streaming.
location = /api/admin/rag/upload {
    client_max_body_size 30m;
    proxy_request_buffering off;
    proxy_pass http://woll_api;
    include /etc/nginx/snippets/woll-proxy.conf;
}

location = /healthz {
    proxy_pass http://woll_api;
    include /etc/nginx/snippets/woll-proxy.conf;
}

location = /readyz {
    proxy_pass http://woll_api;
    include /etc/nginx/snippets/woll-proxy.conf;
}

location = /api/chat {
    limit_req zone=chat burst=30 nodelay;
    client_max_body_size 1m;
    proxy_pass http://woll_api;
    include /etc/nginx/snippets/woll-proxy.conf;
}

# Tiles MVT on-demand para capas dinámicas. Cachea por URL (z/x/y).
location = /api/layer-tiles {
    limit_req zone=proxy burst=200 nodelay;
    proxy_cache proxy_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri$http_origin";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 5m;
    proxy_cache_valid 204 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status always;
    proxy_pass http://woll_api;
    include /etc/nginx/snippets/woll-proxy.conf;
}

location = /api/proxy {
    limit_req zone=proxy burst=200 nodelay;
    proxy_cache proxy_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 1h;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    proxy_pass http://woll_api;
    include /etc/nginx/snippets/woll-proxy.conf;
}

# Tabla de atributos: cache corto por URL (página, filtro, búsqueda, orden).
location = /api/layer-features {
    proxy_cache proxy_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 10s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    # La API responde no-store por defecto; esta tabla es de solo lectura.
    proxy_ignore_headers Cache-Control Expires;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=10" always;
    add_header X-Cache-Status $upstream_cache_status always;
    proxy_pass http://woll_api;
    include /etc/nginx/snippets/woll-proxy.conf;
}

# Estadísticas de ráster: cambian solo al publicar una versión.
location = /api/raster-stats {
    proxy_cache proxy_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 5m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Cache-Status $upstream_cache_status always;
    proxy_pass http://woll_api;
    include /etc/nginx/snippets/woll-proxy.conf;
}

location /api/ {
    proxy_pass http://woll_api;
    include /etc/nginx/snippets/woll-proxy.conf;
}

# ── Estáticos ───────────────────────────────────────────────────────
# Tiles MVT pregenerados: una versión publicada es inmutable (Sprint 08).
# El visor pide /tiles/<layer>/<version>/<z>/<x>/<y>.mvt y Nginx no toca
# PostgreSQL. gzip_types incluye el MIME de MVT en cada server.
# El índice global cambia con cada publicación: no se cachea como inmutable.
location = /tiles/index.json {
    default_type application/json;
    expires -1;
    access_log off;
    try_files $uri =404;
}

# Los tiles vacíos no se escriben en disco: el generador omite las celdas
# sin features. Se responden 204 (tile vacío) para no llenar la consola de
# 404; el cliente los interpreta como "sin capas".
location ~* ^/tiles/.+\.mvt$ {
    default_type application/vnd.mapbox-vector-tile;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri @empty_mvt;
}

location @empty_mvt {
    default_type application/vnd.mapbox-vector-tile;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options "nosniff" always;
    return 204;
}

# Índices y manifiestos: un 404 real no se enmascara (el visor cae a GeoJSON).
location /tiles/ {
    default_type application/vnd.mapbox-vector-tile;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
}

# ── Ráster precalculado (Sprint 49) ────────────────────────────────
# Tiles WebP/PNG inmutables por versión. El índice global cambia con cada
# publicación y no se cachea. La fuente COG vive en data/ y sigue denegada.
location = /raster/index.json {
    default_type application/json;
    expires -1;
    access_log off;
    try_files $uri =404;
}

location ^~ /raster/ {
    default_type image/webp;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
}

# Shapefiles ZIP privados: el worker los lee desde disco, Nginx no los sirve.
location ^~ /geojson/private/ {
    return 404;
}

location ^~ /geojson/ {
    default_type application/geo+json;
    expires 1d;
    access_log off;
    try_files $uri =404;
}

location ^~ /assets/ {
    expires 7d;
    access_log off;
    try_files $uri =404;
}

# Denegar rutas internas antes de la regla de estáticos.
location ~ ^/(?:docs|db|server|scripts|rag|docker|deploy|node_modules|reports|data)(?:/|$) {
    return 404;
}

location ~* ^/(?:package(?:-lock)?\.json|vercel\.json|docker-compose.*\.ya?ml|README\.md|AGENTS\.md|.*\.md)$ {
    return 404;
}

location ~ /\.(?!well-known) {
    deny all;
}

# App JS/CSS: no-cache para que un deploy se vea sin esperar días.
# Librerías vendorizadas y tipografías sí se cachean.
location ^~ /js/lib/ {
    expires 30d;
    access_log off;
    try_files $uri =404;
}

location ^~ /js/ {
    expires -1;
    access_log off;
    try_files $uri =404;
}

location ^~ /css/fonts/ {
    expires 30d;
    access_log off;
    try_files $uri =404;
}

location ^~ /css/ {
    expires -1;
    access_log off;
    try_files $uri =404;
}

location ~* \.(?:js|css|svg|png|jpe?g|gif|webp|ico|woff2?)$ {
    expires 7d;
    access_log off;
    try_files $uri =404;
}

location = /index.html {
    expires -1;
}

# Visor en /visor. La URL no lleva slash final para que los recursos
# relativos del SPA (js/, css/, geojson/) resuelvan contra la raíz.
# /visor/ redirige a /visor para evitar rutas duplicadas.
location = /visor {
    expires -1;
    try_files /index.html =404;
}

location = /visor/ {
    return 301 /visor$is_args$args;
}

# Chat inmersivo: misma SPA, distinta shell. La URL no lleva slash final
# para que los recursos relativos resuelvan contra la raíz.
location = /chat {
    expires -1;
    try_files /index.html =404;
}

location = /chat/ {
    return 301 /chat$is_args$args;
}

location / {
    expires -1;
    try_files $uri $uri/ /geodatos.html;
}
