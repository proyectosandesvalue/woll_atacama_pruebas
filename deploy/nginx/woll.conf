# Nginx de producción con TLS (VPS).
#
# Certificado esperado: /etc/letsencrypt/live/woll/fullchain.pem
# (certbot con --cert-name woll). El HTTP solo sirve ACME y redirige a HTTPS.

limit_req_zone $binary_remote_addr zone=chat:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=proxy:10m rate=1200r/m;
limit_req_status 429;

proxy_cache_path /var/cache/nginx/proxy
    levels=1:2
    keys_zone=proxy_cache:20m
    max_size=2g
    inactive=24h
    use_temp_path=off;

resolver 127.0.0.11 valid=10s ipv6=off;

upstream woll_api {
    zone woll_api 64k;
    server api:3000 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    root /srv/woll;
    index index.html;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/woll/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/woll/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://unpkg.com https://*.tile.openstreetmap.org https://a.tile.opentopomap.org https://mt1.google.com https://mt2.google.com https://mt3.google.com https://esri.ciren.cl https://www.geoportal.cl; connect-src 'self' https://*.tile.openstreetmap.org https://a.tile.opentopomap.org https://mt1.google.com https://mt2.google.com https://mt3.google.com https://esri.ciren.cl https://www.geoportal.cl; worker-src 'self' blob:; child-src 'self' blob:; media-src 'self'; manifest-src 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/geo+json
        text/csv
        application/javascript
        application/xml
        application/vnd.mapbox-vector-tile
        image/svg+xml;

    include /etc/nginx/snippets/woll-locations.conf;
}
