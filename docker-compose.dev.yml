# Overrides para desarrollo local.
#
#   docker compose --env-file .env.local -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Publica PostgreSQL, API y Nginx solo en loopback. No usa TLS: Nginx escucha
# HTTP en 8080 y proxya /api/* a la API.

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  api:
    userns_mode: keep-id
    security_opt:
      - label=disable
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:3000}
    volumes:
      # Recarga de código sin rebuild: el contenedor usa el server del host.
      - ./server:/app/server:ro,Z
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"

  rag-worker:
    userns_mode: keep-id
    security_opt:
      - label=disable
    env_file:
      - .env.local

  nginx:
    volumes:
      - ./deploy/nginx/woll.dev.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./deploy/nginx/woll-locations.conf:/etc/nginx/snippets/woll-locations.conf:ro,Z
      - ./deploy/nginx/woll-proxy.conf:/etc/nginx/snippets/woll-proxy.conf:ro,Z
      - ./:/srv/woll:ro,Z
      - nginx_cache:/var/cache/nginx
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"

  ingest:
    env_file:
      - .env.local
