# Overrides de producción (VPS).
#
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Nginx es el único servicio con puertos públicos. Postgres y API quedan en la
# red interna. Los certificados viven en el volumen `letsencrypt`; el servicio
# `certbot` renueva por webroot y corre en el perfil `tls`.

services:
  api:
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Define ALLOWED_ORIGINS en .env}

  nginx:
    volumes:
      - ./deploy/nginx/woll.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./deploy/nginx/woll-locations.conf:/etc/nginx/snippets/woll-locations.conf:ro,Z
      - ./deploy/nginx/woll-proxy.conf:/etc/nginx/snippets/woll-proxy.conf:ro,Z
      - ./:/srv/woll:ro,Z
      - nginx_cache:/var/cache/nginx
      - letsencrypt:/etc/letsencrypt:ro,Z
      - certbot_www:/var/www/certbot:ro,Z
    ports:
      - "80:80"
      - "443:443"

  ingest:
    env_file:
      - .env

  certbot:
    image: docker.io/certbot/certbot:latest
    profiles: ["tls"]
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
