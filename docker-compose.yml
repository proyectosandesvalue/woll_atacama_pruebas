# Compose base del Sprint 26.
#
# En este tramo (26-C) solo existe PostgreSQL. Los servicios api, nginx e
# ingest se agregan en 26-D. El puerto no se publica en la base: para
# desarrollo se usa docker-compose.dev.yml, que lo expone solo en 127.0.0.1.

name: woll

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: woll/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-woll}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
