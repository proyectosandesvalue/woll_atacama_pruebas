# Compose base del Sprint 26.
#
# Desarrollo:  docker compose --env-file .env.local -f docker-compose.yml -f docker-compose.dev.yml up -d
# Producción:  docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# La base no se publica: solo la red interna de Compose. Nginx es el único
# servicio con puertos expuestos (en el override de producción).

name: woll

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: woll/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-woll}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: woll/api:latest
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_DRIVER: postgres
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Define DATABASE_URL_DOCKER en .env}
      PG_APPLICATION_NAME: woll-api
      GEO_PROVIDER: none
      TRUST_PROXY_HOPS: "1"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      # Panel admin (Sprint 15). Vacío = panel no configurado (503).
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      ADMIN_TOTP_REQUIRED: ${ADMIN_TOTP_REQUIRED:-0}
      CONFIG_API_MAX_AGE: ${CONFIG_API_MAX_AGE:-300}
      TAXONOMY_API_ENABLED: ${TAXONOMY_API_ENABLED:-0}
      # LLM (Vertex AI en local/VPS; openai-compatible para demo)
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_SUPPORTS_PARALLEL_TOOLS: ${LLM_SUPPORTS_PARALLEL_TOOLS:-true}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-0}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      # Embeddings (el API los usará en 18-D para embeber la pregunta)
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-openai-compatible}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_DIM: ${EMBEDDINGS_DIM:-1024}
      EMBEDDINGS_SEND_DIMENSIONS: ${EMBEDDINGS_SEND_DIMENSIONS:-0}
      EMBEDDINGS_LOCATION: ${EMBEDDINGS_LOCATION:-}
      EMBEDDINGS_TASK_TYPE: ${EMBEDDINGS_TASK_TYPE:-RETRIEVAL_DOCUMENT}
    volumes:
      - ./rag:/app/rag:z
      - ./geojson:/app/geojson:z
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  rag-worker:
    build:
      context: .
      dockerfile: docker/rag-worker/Dockerfile
    image: woll/rag-worker:latest
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Define DATABASE_URL_DOCKER en .env}
      RAG_DATABASE_URL: ${RAG_DATABASE_URL_DOCKER:-${DATABASE_URL_DOCKER}}
      RAG_MANIFEST_PATH: rag/manifest.json
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-openai-compatible}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_DIM: ${EMBEDDINGS_DIM:-1024}
      EMBEDDINGS_SEND_DIMENSIONS: ${EMBEDDINGS_SEND_DIMENSIONS:-0}
      EMBEDDINGS_LOCATION: ${EMBEDDINGS_LOCATION:-}
      EMBEDDINGS_TASK_TYPE: ${EMBEDDINGS_TASK_TYPE:-RETRIEVAL_DOCUMENT}
      EMBEDDINGS_PRICE_PER_MTOK: ${EMBEDDINGS_PRICE_PER_MTOK:-0}
      RAG_EMBED_BATCH: ${RAG_EMBED_BATCH:-32}
    volumes:
      - ./rag:/app/rag:z
    networks:
      - internal
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  layer-worker:
    build:
      context: .
      dockerfile: docker/layer-worker/Dockerfile
    image: woll/layer-worker:latest
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Define DATABASE_URL_DOCKER en .env}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL_DOCKER:-${DATABASE_URL_DOCKER}}
      PG_APPLICATION_NAME: woll-layer-worker
    command: ["node", "scripts/layer-worker.mjs"]
    volumes:
      - ./geojson:/app/geojson:z
      - ./tiles:/app/tiles:z
    networks:
      - internal
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  nginx:
    image: docker.io/library/nginx:1.27.5-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  ingest:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: woll/api:latest
    restart: "no"
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_DRIVER: postgres
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Define DATABASE_URL_DOCKER en .env}
      PG_APPLICATION_NAME: woll-ingest
      GEO_PROVIDER: none
      METEOCHILE_USER: ${METEOCHILE_USER:-}
      METEOCHILE_TOKEN: ${METEOCHILE_TOKEN:-}
    entrypoint: ["node", "scripts/ingest-run.mjs"]
    networks:
      - internal
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # Chequeo operativo (Sprint 31-B). Sin socket de Docker; solo lee el
  # directorio de backups montado y consulta la red interna.
  ops-check:
    profiles: ["ops"]
    image: woll/api:latest
    restart: "no"
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_DRIVER: postgres
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Define DATABASE_URL_DOCKER en .env}
      PG_APPLICATION_NAME: woll-ops
      OPS_ALERT_WEBHOOK: ${OPS_ALERT_WEBHOOK:-}
      OPS_BACKUP_DIR: ${OPS_BACKUP_DIR:-/var/backups/woll}
      OPS_DISK_PATH: ${OPS_DISK_PATH:-/var/backups/woll}
      OPS_HEALTH_API: ${OPS_HEALTH_API:-http://api:3000/healthz}
      OPS_HEALTH_NGINX: ${OPS_HEALTH_NGINX:-http://nginx/nginx-health}
      OPS_CERT_HOST: ${OPS_CERT_HOST:-nginx}
      OPS_CERT_PORT: ${OPS_CERT_PORT:-443}
      OPS_CERT_SERVERNAME: ${OPS_CERT_SERVERNAME:-localhost}
      OPS_MAX_DISK_PCT: ${OPS_MAX_DISK_PCT:-80}
      OPS_MAX_BACKUP_HOURS: ${OPS_MAX_BACKUP_HOURS:-26}
      OPS_MIN_CERT_DAYS: ${OPS_MIN_CERT_DAYS:-14}
      OPS_MAX_HEARTBEAT_MIN: ${OPS_MAX_HEARTBEAT_MIN:-10}
      OPS_MAX_BACKLOG: ${OPS_MAX_BACKLOG:-25}
    volumes:
      - ${OPS_BACKUP_HOST_DIR:-/var/backups/woll}:${OPS_BACKUP_DIR:-/var/backups/woll}:ro
    entrypoint: ["node", "scripts/ops-check.mjs"]
    networks:
      - internal
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  pgdata:
  nginx_cache:
  letsencrypt:
  certbot_www:

networks:
  internal:
    driver: bridge
